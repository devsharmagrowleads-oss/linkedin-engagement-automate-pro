services:
  - type: web
    name: growleads-admin
    runtime: node
    region: singapore
    plan: free
    rootDir: admin
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ADMIN_PORT
        value: 10000
      - key: ADMIN_API_KEY
        generateValue: true
      - key: INACTIVE_HOURS
        value: 48
      - key: NODE_ENV
        value: production
