<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A84FF"/>
      <stop offset="100%" style="stop-color:#5E5CE6"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#30D158"/>
      <stop offset="100%" style="stop-color:#64D2FF"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Letter G -->
  <text x="256" y="340" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif" font-size="320" font-weight="700" fill="white" opacity="0.95">G</text>
  <!-- Growth arrow -->
  <path d="M 340 140 L 400 140 L 400 200" stroke="url(#arrow)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="400" y1="140" x2="310" y2="230" stroke="url(#arrow)" stroke-width="28" stroke-linecap="round"/>
</svg>
